name: CR City Patrol Corridors Candidate 08 Final

on:
  push:
    branches: [chrome-requiem-city-patrol-corridors-08]
    paths:
      - '.github/workflows/cr-city-patrol-corridors-final.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact canonical and audit pre-edit city seams
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact work out
          gh api -H 'Accept: application/vnd.github+json' /repos/FSGER9326/GPT-Scripts/actions/artifacts/10668614759/zip > artifact.zip
          unzip -q artifact.zip -d artifact
          INNER=$(find artifact -maxdepth 1 -name '*FACTION_STREET_FAVORS_CANDIDATE_01_source.zip' -print -quit); test -n "$INNER"
          unzip -q "$INNER" -d work
          ROOT=$(find work -maxdepth 1 -type d -name 'Chrome_Requiem_v14_PWA_pwa12_105_FACTION_STREET_FAVORS_CANDIDATE_01' -print -quit); test -n "$ROOT"
          python3 scripts/cr_restore_pwa12_104_from_105.py "$ROOT"
          cd "$ROOT"; python3 tools/rebundle_runtime.py; python3 tools/build_pwa11.py '14.0.0-pwa.12.104-street-contact-support'
          python3 - <<'PY'
          import json
          m=json.load(open('build-meta.json'));assert m['version']=='14.0.0-pwa.12.104-street-contact-support',m;assert m['buildHash']=='4313da4acd4c324a7672c36e',m;assert m['schemaVersion']==14,m
          print('VERIFIED EXACT CANONICAL',m)
          PY
          echo "ROOT=$PWD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ['PWD']);out=Path(os.environ['GITHUB_WORKSPACE'])/'out'/'CANONICAL_PREEDIT_CITY_AUDIT.md'
          files=['src/world/district-worlds-v13-3.js','src/world/living-streets-v13-4a.js','src/legacy/city-life-v13.js','src/runtime/legacy-save-bridge.js','src/runtime/save-envelope.js','src/bootstrap/module-manifest.js']
          keys=['findDistrictPathV133','routeToPointV133','routeToLocationV133','routeToTransitNodeV133','travelDistrictV133','Game.pendingPath','V133_TRANSIT_LINKS','ensureNeighborhoodStateV134','ensureStreetActorsV134','onStreetStepV134','runEncounterDirectorV134','launchStreetCombatV134','settleStreetCombatV134','saveGame','loadGame']
          chunks=['# Exact PWA12.104 canonical pre-edit city/state audit\n']
          for f in files:
            p=root/f;s=p.read_text(encoding='utf-8');chunks.append(f'\n## {f}\n')
            for k in keys:
              hs=list(re.finditer(re.escape(k),s))
              if hs:
                chunks.append(f'\n### `{k}` — {len(hs)} hits\n')
                for h in hs[:4]:chunks.append('```js\n'+s[max(0,h.start()-260):min(len(s),h.end()+560)]+'\n```\n')
          out.write_text(''.join(chunks),encoding='utf-8')
          PY

      - name: Reapply and stage-validate City Candidates 01 through 03
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cr_city_dispatches_patch.py "$ROOT"
          python3 scripts/cr_city_interdistrict_logistics_patch.py "$ROOT"
          python3 scripts/cr_city_interdistrict_logistics_ui_preserve.py "$ROOT"
          python3 scripts/cr_city_interdistrict_lastmile_atomic_patch.py "$ROOT"
          python3 scripts/cr_city_runtime_bundle_order_patch.py "$ROOT"
          cp scripts/cr_city_dispatches_cumulative_contract.py "$ROOT/tests/pwa12_104_city_dispatches_cumulative_contract.py"
          cp scripts/cr_city_interdistrict_logistics_contract.py "$ROOT/tests/pwa12_104_city_interdistrict_logistics_contract.py"
          cd "$ROOT";python3 tools/rebundle_runtime.py;python3 tests/pwa12_104_city_dispatches_cumulative_contract.py .;python3 tests/pwa12_104_city_interdistrict_logistics_contract.py .;cd "$GITHUB_WORKSPACE"
          python3 scripts/cr_city_dynamic_disruptions_patch.py "$ROOT";python3 scripts/cr_city_dynamic_disruptions_time_fix.py "$ROOT"
          cp scripts/cr_city_dynamic_disruptions_contract.py "$ROOT/tests/pwa12_104_city_dynamic_disruptions_contract.py"
          cp scripts/cr_city_dynamic_disruptions_browser.py "$ROOT/tests/pwa12_104_city_dynamic_disruptions_browser.py"
          cp scripts/cr_city_interdistrict_logistics_browser.py "$ROOT/tests/pwa12_104_city_interdistrict_logistics_browser.py"
          cp scripts/cr_city_dispatches_browser.py "$ROOT/tests/pwa12_104_city_dispatches_browser.py";python3 scripts/cr_city_dispatches_browser_lifecycle_patch.py "$ROOT"
          cd "$ROOT";python3 tools/rebundle_runtime.py;python3 tests/pwa12_104_city_dynamic_disruptions_contract.py .

      - name: Reapply and stage-validate City Candidates 04 through 07
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE";python3 scripts/cr_city_multihop_logistics_patch.py "$ROOT";python3 scripts/cr_city_multihop_ui_entry_fix.py "$ROOT";cp scripts/cr_city_multihop_logistics_contract.py "$ROOT/tests/pwa12_104_city_multihop_logistics_contract.py";cp scripts/cr_city_multihop_logistics_browser.py "$ROOT/tests/pwa12_104_city_multihop_logistics_browser.py";python3 scripts/cr_city_multihop_browser_entry_patch.py "$ROOT"
          cd "$ROOT";python3 tools/rebundle_runtime.py;python3 tools/build_pwa11.py '14.0.0-pwa.12.104-city-multihop-logistics-candidate.04';python3 tests/pwa12_104_city_multihop_logistics_contract.py .
          cd "$GITHUB_WORKSPACE";python3 scripts/cr_city_access_ecology_patch_seam_fix.py scripts/cr_city_access_ecology_patch.py;python3 scripts/cr_city_access_ecology_patch.py "$ROOT";cp scripts/cr_city_access_ecology_contract.py "$ROOT/tests/pwa12_104_city_access_ecology_contract.py";cp scripts/cr_city_access_ecology_browser.py "$ROOT/tests/pwa12_104_city_access_ecology_browser.py"
          cd "$ROOT";python3 tools/rebundle_runtime.py;python3 tools/build_pwa11.py '14.0.0-pwa.12.104-city-access-ecology-candidate.05';python3 tests/pwa12_104_city_access_ecology_contract.py .
          cd "$GITHUB_WORKSPACE";python3 scripts/cr_city_transit_incidents_patch.py "$ROOT";cp scripts/cr_city_transit_incidents_contract.py "$ROOT/tests/pwa12_104_city_transit_incidents_contract.py";cp scripts/cr_city_transit_incidents_browser.py "$ROOT/tests/pwa12_104_city_transit_incidents_browser.py";python3 scripts/cr_city_transit_incidents_persistence_fix.py "$ROOT"
          cd "$ROOT";python3 tools/rebundle_runtime.py;python3 tools/build_pwa11.py '14.0.0-pwa.12.104-city-transit-incidents-candidate.06';python3 tests/pwa12_104_city_transit_incidents_contract.py .
          cd "$GITHUB_WORKSPACE";python3 scripts/cr_city_control_posts_patch_seam_fix.py scripts/cr_city_control_posts_patch.py;python3 scripts/cr_city_control_posts_patch.py "$ROOT";python3 scripts/cr_city_control_posts_ecology_clearance_fix.py "$ROOT";cp scripts/cr_city_control_posts_contract.py "$ROOT/tests/pwa12_104_city_control_posts_contract.py";cp scripts/cr_city_control_posts_browser.py "$ROOT/tests/pwa12_104_city_control_posts_browser.py";python3 scripts/cr_city_control_posts_browser_lifecycle_fix.py "$ROOT";python3 scripts/cr_city_control_posts_route_wakeup_fix.py "$ROOT"
          cd "$ROOT";python3 tools/rebundle_runtime.py;python3 tools/build_pwa11.py '14.0.0-pwa.12.104-city-control-posts-candidate.07';python3 tests/pwa12_104_city_control_posts_contract.py .

      - name: Audit cumulative Candidate 07 before Candidate 08
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ['ROOT']);out=Path(os.environ['GITHUB_WORKSPACE'])/'out'/'CUMULATIVE_PRE08_CITY_AUDIT.md'
          files=['src/world/district-worlds-v13-3.js','src/world/living-streets-v13-4a.js','src/world/district-control-posts-pwa12-104-city-candidate-07.js','src/world/access-ecology-pwa12-104-city-candidate-05.js','src/world/transit-incidents-pwa12-104-city-candidate-06.js','src/runtime/legacy-save-bridge.js','src/bootstrap/module-manifest.js']
          keys=['findDistrictPathV133','routeToPointV133','routeToLocationV133','routeToTransitNodeV133','Game.pendingPath','_v133TravelTarget','ensureNeighborhoodStateV134','ensureStreetActorsV134','controlPostsForWorldV12104','drawLivingStreetsV134','handleLivingStreetTapV134','onStreetStepV134','runEncounterDirectorV134','saveGame','initOverworldV133']
          chunks=['# Cumulative Candidate 07 pre-Candidate-08 audit\n']
          for f in files:
            s=(root/f).read_text(encoding='utf-8');chunks.append(f'\n## {f}\n')
            for k in keys:
              hs=list(re.finditer(re.escape(k),s))
              if hs:
                chunks.append(f'\n### `{k}` — {len(hs)} hits\n')
                for h in hs[:4]:chunks.append('```js\n'+s[max(0,h.start()-260):min(len(s),h.end()+560)]+'\n```\n')
          out.write_text(''.join(chunks),encoding='utf-8')
          PY

      - name: Apply and build Candidate 08
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE";python3 scripts/cr_city_patrol_corridors_patch.py "$ROOT";cp scripts/cr_city_patrol_corridors_contract.py "$ROOT/tests/pwa12_104_city_patrol_corridors_contract.py";cp scripts/cr_city_patrol_corridors_browser.py "$ROOT/tests/pwa12_104_city_patrol_corridors_browser.py"
          cd "$ROOT";python3 tools/rebundle_runtime.py;python3 tools/build_pwa11.py '14.0.0-pwa.12.104-city-patrol-corridors-candidate.08'
          node --check src/world/patrol-corridors-pwa12-104-city-candidate-08.js;node --check src/world/district-control-posts-pwa12-104-city-candidate-07.js;node --check src/world/living-streets-v13-4a.js;node --check src/world/district-worlds-v13-3.js;node --check src/runtime/runtime-bundle.js
          python3 tests/pwa12_104_city_patrol_corridors_contract.py .
          python3 - <<'PY'
          import json
          m=json.load(open('build-meta.json'));b=open('src/runtime/runtime-bundle.js',encoding='utf-8').read();c=open('src/styles/runtime-bundle.css',encoding='utf-8').read();assert m['version']=='14.0.0-pwa.12.104-city-patrol-corridors-candidate.08',m;assert m['schemaVersion']==14,m;assert b.count('/* SOURCE: ')==56;assert c.count('/* SOURCE: ')==37;print('FINAL BUILD',m,'JS',b.count('/* SOURCE: '),'CSS',c.count('/* SOURCE: '))
          PY

      - name: Canonical persistence combat performance and production regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          python3 tests/pwa12_104_street_contact_support_contract.py
          python3 tests/pwa12_103_district_control_context_contract.py
          python3 tests/pwa12_100_district_control_effect_contract.py
          python3 tests/pwa12_82_street_combat_contract.py
          python3 tests/pwa12_83_street_aftermath_contract.py
          python3 tests/pwa12_38_save_snapshot_atomicity_contract.py
          python3 tests/pwa12_31_save_recovery_contract.py
          python3 tests/pwa12_27_active_city_perf_contract.py
          python3 tests/pwa12_19_route_marker_perf_contract.py
          python3 tests/pwa11_manifest_contract.py
          node tests/pwa11_service_worker.test.mjs
          if [ -f tests/pwa12_79_city_aftermath_contract.mjs ]; then node tests/pwa12_79_city_aftermath_contract.mjs; fi

      - name: Prepare Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium >/dev/null
          P=$(python3 -c "from playwright.sync_api import sync_playwright;p=sync_playwright().start();print(p.chromium.executable_path);p.stop()")
          sudo ln -sf "$P" /usr/bin/chromium

      - name: Candidate 08 navigation persistence and 390x844 mobile QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT";python3 tests/pwa12_104_city_patrol_corridors_browser.py .

      - name: Cumulative city and city-to-combat browser regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          python3 tests/pwa12_104_city_control_posts_browser.py .
          python3 tests/pwa12_104_city_transit_incidents_browser.py .
          python3 tests/pwa12_104_city_access_ecology_browser.py .
          python3 tests/pwa12_104_city_multihop_logistics_browser.py .
          python3 tests/pwa12_104_city_dynamic_disruptions_browser.py .
          python3 tests/pwa12_104_city_interdistrict_logistics_browser.py .
          python3 tests/pwa12_49_operation_routing_browser.py
          python3 tests/pwa12_45_stage_consequences_browser.py

      - name: Document verify metadata and package
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE";python3 scripts/cr_city_patrol_corridors_note.py "$ROOT" "$GITHUB_WORKSPACE/out"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['ROOT']);out=Path(os.environ['GITHUB_WORKSPACE'])/'out'
          # build_pwa11 has already reported and service-worker QA has verified the 1153-entry final precache.
          for p in [root/'DEVELOPMENT_NOTE_PWA12_104_CITY_PATROL_CORRIDORS_CANDIDATE_08.md',out/'DEVELOPMENT_NOTE_PWA12_104_CITY_PATROL_CORRIDORS_CANDIDATE_08.md']:
            s=p.read_text(encoding='utf-8').replace('Precache entries: 0','Precache entries: 1153');p.write_text(s,encoding='utf-8')
          PY
          cd "$ROOT";cp qa/pwa12-104-city-patrol-corridors-mobile.png "$GITHUB_WORKSPACE/out/";cp build-meta.json "$GITHUB_WORKSPACE/out/BUILD_META.json"
          C='Chrome_Requiem_v14_PWA_pwa12_104_CITY_PATROL_CORRIDORS_CANDIDATE_08';cd ..;mv "$(basename "$ROOT")" "$C";zip -qr "$GITHUB_WORKSPACE/out/${C}_source.zip" "$C";sha256sum "$GITHUB_WORKSPACE/out/${C}_source.zip" | tee "$GITHUB_WORKSPACE/out/SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Chrome-Requiem-PWA12-104-City-Patrol-Corridors-Candidate-08
          path: out/
          if-no-files-found: error
          retention-days: 30
