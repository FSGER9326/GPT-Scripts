name: CR Workshop Calibration Runner
on:
  push:
    branches: ['agent/cr-workshop-calibration-pwa12-104']
    paths:
      - 'tmp_cr_runner/**'
      - '.github/workflows/cr-workshop-calibration-runner.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CR_SOURCE_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-3b00-8246-a043-1f63d9211627/raw?se=2026-09-22T04%3A46%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=fecea2ec-5d51-5a6a-acaf-9baa08095a17&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T21%3A39%3A11Z&ske=2026-09-22T21%3A39%3A11Z&sks=b&skv=2026-02-06&sig=oEnScGGM/idM0a/gle510n9a34XNeW2r9ZYZazGETWk%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Audit exact canonical source
        shell: bash
        run: |
          set -euo pipefail
          python tmp_cr_runner/audit_canonical.py | tee cr-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr-workshop-calibration-audit
          path: cr-audit.log
