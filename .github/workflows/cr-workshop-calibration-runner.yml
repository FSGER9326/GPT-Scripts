name: CR Workshop Calibration Runner
on:
  push:
    branches: ['agent/cr-workshop-calibration-pwa12-104']
    paths:
      - 'tmp_cr_runner/**'
      - '.github/workflows/cr-workshop-calibration-runner.yml'
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cr-workshop-calibration-build
          path: prior
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FSGER9326/GPT-Scripts
          run-id: 35688129184
      - name: Inspect exact candidate seams
        run: |
          CANDIDATE="$GITHUB_WORKSPACE/prior/cr_build/Chrome_Requiem_v14_PWA_pwa12_104_WORKSHOP_CALIBRATION_CANDIDATE_02_source"
          python tmp_cr_runner/inspect_candidate_seams.py "$CANDIDATE"
