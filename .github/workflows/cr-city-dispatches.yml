name: CR City District Dispatches

on:
  push:
    paths:
      - '.github/workflows/cr-city-dispatches.yml'
      - 'scripts/cr_city_dispatches_patch.py'
      - 'scripts/cr_city_dispatches_contract.py'
      - 'scripts/cr_city_dispatches_browser.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact PWA12.104 canonical
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact work out
          gh api -H 'Accept: application/vnd.github+json' /repos/FSGER9326/GPT-Scripts/actions/artifacts/10668614759/zip > artifact.zip
          unzip -q artifact.zip -d artifact
          INNER=$(find artifact -maxdepth 1 -name '*FACTION_STREET_FAVORS_CANDIDATE_01_source.zip' -print -quit)
          unzip -q "$INNER" -d work
          ROOT=$(find work -maxdepth 1 -type d -name 'Chrome_Requiem_v14_PWA_pwa12_105_FACTION_STREET_FAVORS_CANDIDATE_01' -print -quit)
          python3 scripts/cr_restore_pwa12_104_from_105.py "$ROOT"
          cd "$ROOT"
          python3 tools/rebundle_runtime.py
          python3 tools/build_pwa11.py '14.0.0-pwa.12.104-street-contact-support'
          python3 - <<'PY'
          import json
          m=json.load(open('build-meta.json'))
          assert m['buildHash']=='4313da4acd4c324a7672c36e',m
          assert m['schemaVersion']==14,m
          print('VERIFIED EXACT CANONICAL',m)
          PY
          echo "ROOT=$PWD" >> "$GITHUB_ENV"
      - name: Patch and build candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cr_city_dispatches_patch.py "$ROOT"
          cp scripts/cr_city_dispatches_contract.py "$ROOT/tests/pwa12_104_city_dispatches_contract.py"
          cp scripts/cr_city_dispatches_browser.py "$ROOT/tests/pwa12_104_city_dispatches_browser.py"
          cd "$ROOT"
          python3 tools/rebundle_runtime.py
          python3 tools/build_pwa11.py '14.0.0-pwa.12.104-city-district-dispatches-candidate.01'
          node --check src/world/district-dispatches-pwa12-104-city-candidate-01.js
          node --check src/runtime/runtime-bundle.js
      - name: Static and inherited regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          python3 tests/pwa12_104_city_dispatches_contract.py .
          python3 tests/pwa12_104_street_contact_support_contract.py
          python3 tests/pwa12_103_district_control_context_contract.py
          python3 tests/pwa12_100_district_control_effect_contract.py
          python3 tests/pwa12_38_save_snapshot_atomicity_contract.py
          python3 tests/pwa12_31_save_recovery_contract.py
          python3 tests/pwa12_27_active_city_perf_contract.py
          python3 tests/pwa12_19_route_marker_perf_contract.py
          python3 tests/pwa11_manifest_contract.py
          node tests/pwa11_service_worker.test.mjs
      - name: Prepare Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium >/dev/null
          P=$(python3 -c "from playwright.sync_api import sync_playwright;p=sync_playwright().start();print(p.chromium.executable_path);p.stop()")
          sudo ln -sf "$P" /usr/bin/chromium
      - name: Browser integration and routing regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          python3 tests/pwa12_104_city_dispatches_browser.py .
          python3 tests/pwa12_49_operation_routing_browser.py
          python3 tests/pwa12_45_stage_consequences_browser.py
      - name: Document and package
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          python3 - <<'PY'
          import json, pathlib
          m=json.load(open('build-meta.json'))
          note=f'''# Chrome Requiem PWA12.104 City District Dispatches Candidate 01\n\n## Provenance\n- Reconstructed exact canonical `14.0.0-pwa.12.104-street-contact-support`.\n- Canonical deterministic build hash was reproduced before editing: `4313da4acd4c324a7672c36e`.\n- Candidate version: `{m['version']}`.\n- Candidate build hash: `{m['buildHash']}`.\n- Save schema remains `{m['schemaVersion']}`.\n\n## Implemented\nA physical **District Dispatches** city loop. Known contact/shop/clinic locations can offer one local courier, medical, data, or contraband run while the crew is physically at the source. Quotes use the real A* street path plus neighborhood Security, Gang Pressure, Unrest, and Local Heat. Accepting reveals the delivery coordinate and commits the existing `Game.pendingPath`; there is no teleport or menu completion. Arrival is detected through the existing Living Streets step hook. Payout, deadline/late reduction, contact trust, target prosperity/unrest, and local heat consequences persist under `Game.livingStreetsV134.districtDispatches` without a schema bump.\n\n## Verification executed\n- Exact canonical reconstruction and build-hash equality before patching.\n- JS syntax for the new module and rebuilt runtime bundle.\n- 19-check focused dispatch contract.\n- PWA12.104 street-contact-support regression.\n- PWA12.103 / PWA12.100 district-control regressions.\n- Save snapshot atomicity + save recovery regressions.\n- Active-city and route-marker performance contracts.\n- Manifest and service-worker tests.\n- Chromium end-to-end dispatch QA at 390×844: physical source gating, risk/payout response, real pendingPath creation, save/load preservation, street-step delivery, rewards, and no horizontal overflow.\n- Existing operation-routing and stage-consequence browser regressions.\n\n## Known limits\n- Dispatches are intentionally intra-district in Candidate 01; cross-district logistics should build on transit choices in a later pass rather than auto-chain transit.\n- Route risk is sampled from neighborhoods crossed by the A* path when the offer is generated; payout is then locked, so later neighborhood changes do not retroactively reprice an accepted job.\n- One active dispatch is allowed at a time to keep the street HUD and route authority unambiguous.\n\n## Next city target\nExtend dispatches into **multi-district logistics chains** where a source can require a chosen border/metro/freight/hidden transit leg, with checkpoint risk, incident-driven rerouting, and destination-side faction consequences while preserving manual physical transit choice.\n'''
          pathlib.Path('DEVELOPMENT_NOTE_PWA12_104_CITY_DISTRICT_DISPATCHES_CANDIDATE_01.md').write_text(note)
          print(note)
          PY
          cp DEVELOPMENT_NOTE_PWA12_104_CITY_DISTRICT_DISPATCHES_CANDIDATE_01.md "$GITHUB_WORKSPACE/out/"
          cp qa/pwa12-104-city-dispatches-mobile.png "$GITHUB_WORKSPACE/out/"
          cp build-meta.json "$GITHUB_WORKSPACE/out/BUILD_META.json"
          C='Chrome_Requiem_v14_PWA_pwa12_104_CITY_DISTRICT_DISPATCHES_CANDIDATE_01'
          cd ..; mv "$(basename "$ROOT")" "$C"; zip -qr "$GITHUB_WORKSPACE/out/${C}_source.zip" "$C"
          sha256sum "$GITHUB_WORKSPACE/out/${C}_source.zip" | tee "$GITHUB_WORKSPACE/out/SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Chrome-Requiem-PWA12-104-City-District-Dispatches-Candidate-01
          path: out/
          if-no-files-found: error
          retention-days: 30
