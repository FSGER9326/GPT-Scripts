name: Chrome Requiem Social 142 Build
on:
  push:
    branches: [agent/chrome-requiem-social-20260922]
jobs:
  build142:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download QA-verified PWA12.138 baseline
        run: |
          curl --fail --location --retry 3 --output source138.zip "$(cat ci/source138_url.txt)"
          test "$(stat -c%s source138.zip)" -gt 80000000
      - name: Prepare PWA12.142 candidate and integrate recovery bonds
        run: |
          python3 - <<'PY'
          import zipfile,pathlib,shutil,re
          z=zipfile.ZipFile('source138.zip'); names=z.namelist(); idx=next(n for n in names if n.endswith('/index.html')); oldroot=idx[:-len('index.html')]
          tmp=pathlib.Path('extract'); z.extractall(tmp); src=tmp/oldroot
          dst=pathlib.Path('Chrome_Requiem_v14_PWA_pwa12_142_RECOVERY_BONDS_CANDIDATE_01_source')
          if dst.exists(): shutil.rmtree(dst)
          shutil.copytree(src,dst)
          js=pathlib.Path('ci/recovery-support-v14.js').read_text()
          js=js.replace("renderRecoverySupportV14:renderSupport,runDiagnosticsRecoverySupportV14", "renderRecoverySupportV14:renderSupport,decorateRecoverySupportBriefingV14:decorateBriefing,runDiagnosticsRecoverySupportV14")
          js=js.replace("add('mission exclusion hook',window.createCombatUnits===createCombatUnits)", "add('mission exclusion hook',typeof window.createCombatUnits==='function')")
          js=js.replace("if(!(patient.injuries||[]).includes(a.injuryId))return h?.outcome||'treated_elsewhere';", "if(!(patient.injuries||[]).includes(a.injuryId)){if(h?.outcome)return h.outcome;return Number(Game.day||1)>=Number(a.dueDay||Infinity)?'recovered':'treated_elsewhere';}")
          (dst/'src/company/recovery-support-v14.js').write_text(js)
          css=pathlib.Path('ci/38-v14-recovery-bonds.css').read_text(); (dst/'src/styles/38-v14-recovery-bonds.css').write_text(css)
          shutil.copy2('ci/pwa12_142_recovery_bonds_browser.py',dst/'tests/pwa12_142_recovery_bonds_browser.py')
          p=dst/'src/bootstrap/module-manifest.js'; t=p.read_text(); lines=t.splitlines(); out=[]
          for line in lines:
              out.append(line)
              if "'company.crewIntercession'" in line and 'path:' in line and 'company.recoverySupport' not in t:
                  ind=line[:len(line)-len(line.lstrip())]; out.append(ind+"'company.recoverySupport':{path:'./src/company/recovery-support-v14.js',kind:'module'},")
              elif line.strip()=="'company.crewIntercession'," and "'company.recoverySupport'," not in t:
                  ind=line[:len(line)-len(line.lstrip())]; out.append(ind+"'company.recoverySupport',")
          p.write_text('\n'.join(out)+'\n')
          p=dst/'src/bootstrap/compatibility-manifest.js'; t=p.read_text()
          if 'runDiagnosticsRecoverySupportV14' not in t:
              lines=t.splitlines(); out=[]; inserted=False
              for line in lines:
                  out.append(line)
                  if 'runDiagnosticsCrewIntercessionV14' in line:
                      ind=line[:len(line)-len(line.lstrip())]; out.append(ind+"'runDiagnosticsRecoverySupportV14',"); inserted=True
              if not inserted: raise SystemExit('compatibility insertion anchor missing')
              p.write_text('\n'.join(out)+'\n')
          p=dst/'tools/build_pwa11.py'; t=p.read_text(); lines=t.splitlines(); out=[]
          for line in lines:
              out.append(line)
              if 'src/company/crew-intercession-v14.js' in line and 'recovery-support-v14.js' not in t:
                  ind=line[:len(line)-len(line.lstrip())]; q='"' if '"' in line else "'"; out.append(ind+q+'src/company/recovery-support-v14.js'+q+',')
              if 'src/styles/37-v14-crew-intercession.css' in line and '38-v14-recovery-bonds.css' not in t:
                  ind=line[:len(line)-len(line.lstrip())]; q='"' if '"' in line else "'"; out.append(ind+q+'src/styles/38-v14-recovery-bonds.css'+q+',')
          p.write_text('\n'.join(out)+'\n')
          def insert_after(bp,old,new,text):
              s=bp.read_text(); marker=f'/* SOURCE: {old} */'; pos=s.find(marker)
              if pos<0: raise SystemExit('missing source marker '+marker)
              start=pos+len(marker); m=re.search(r'/\* SOURCE: [^*]+ \*/',s[start:]); ins=start+(m.start() if m else len(s)-start)
              if new not in s: s=s[:ins]+f'\n/* SOURCE: {new} */\n'+text.rstrip()+'\n\n'+s[ins:]
              bp.write_text(s)
          insert_after(dst/'src/runtime/runtime-bundle.js','src/company/crew-intercession-v14.js','src/company/recovery-support-v14.js',js)
          insert_after(dst/'src/styles/styles-bundle.css','src/styles/37-v14-crew-intercession.css','src/styles/38-v14-recovery-bonds.css',css)
          (dst/'PWA12_142_BASELINE.txt').write_text('Baseline: PWA12.138 Crew Intercession Rebase Candidate 01 QA Verified\nParent cumulative line: PWA12.136 Integration Release Candidate 01\nNew subsystem: Crew Recovery Bonds / recovery support\n')
          PY
      - name: Build candidate and syntax-check executable bundles
        working-directory: Chrome_Requiem_v14_PWA_pwa12_142_RECOVERY_BONDS_CANDIDATE_01_source
        run: |
          mkdir -p qa
          node --check src/company/recovery-support-v14.js | tee qa/node-check-module.log
          node --check src/runtime/runtime-bundle.js | tee qa/node-check-runtime.log
          python3 tools/build_pwa11.py 14.0.0-pwa.12.142-recovery-bonds-candidate.01 | tee qa/build.log
          cat build-meta.json | tee qa/build-meta.log
      - name: Run focused static regressions
        working-directory: Chrome_Requiem_v14_PWA_pwa12_142_RECOVERY_BONDS_CANDIDATE_01_source
        run: |
          set -o pipefail
          python3 tests/pwa12_123_mission_lifecycle_contract.py | tee qa/mission-lifecycle.log
          python3 tests/pwa12_31_save_recovery_contract.py | tee qa/save-recovery.log
          python3 tests/pwa12_38_save_snapshot_atomicity_contract.py | tee qa/save-atomicity.log
          python3 tests/pwa12_131_module_manifest_topology_contract.py | tee qa/module-topology.log
          node tests/pwa11_service_worker.test.mjs | tee qa/service-worker.log
      - name: Install browser QA dependencies
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1 || { cat /tmp/playwright-install.log; exit 1; }
      - name: Run recovery-bonds browser flow at mobile viewport
        working-directory: Chrome_Requiem_v14_PWA_pwa12_142_RECOVERY_BONDS_CANDIDATE_01_source
        run: |
          set -o pipefail
          python3 -m http.server 8765 > qa/http-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          CR_BASE_URL=http://127.0.0.1:8765 CR_QA_DIR=qa python3 tests/pwa12_142_recovery_bonds_browser.py | tee qa/recovery-bonds-browser.log
      - name: Run release preflight
        working-directory: Chrome_Requiem_v14_PWA_pwa12_142_RECOVERY_BONDS_CANDIDATE_01_source
        run: |
          set -o pipefail
          python3 tools/release_preflight.py | tee qa/release-preflight.log
      - name: Write development record and package candidate
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,zipfile
          root=pathlib.Path('Chrome_Requiem_v14_PWA_pwa12_142_RECOVERY_BONDS_CANDIDATE_01_source')
          meta=json.loads((root/'build-meta.json').read_text())
          note=pathlib.Path('ci/DEVELOPMENT_NOTE_PWA12_142_RECOVERY_BONDS.md').read_text()
          note=note.replace('{{VERSION}}',str(meta['version'])).replace('{{BUILD_HASH}}',str(meta['buildHash'])).replace('{{SCHEMA}}',str(meta['schemaVersion']))
          (root/'DEVELOPMENT_NOTE_PWA12_142_RECOVERY_BONDS.md').write_text(note)
          out=pathlib.Path('Chrome_Requiem_v14_PWA_pwa12_142_RECOVERY_BONDS_CANDIDATE_01_source.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in root.rglob('*'):
                  if p.is_file(): z.write(p,arcname=str(root.name/pathlib.Path(p.relative_to(root))))
          sha=hashlib.sha256(out.read_bytes()).hexdigest(); pathlib.Path('PWA12_142_SHA256.txt').write_text(f'{sha}  {out.name}\n')
          print(out.name,out.stat().st_size,sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Chrome-Requiem-PWA12.142-Recovery-Bonds-Candidate-01
          path: |
            Chrome_Requiem_v14_PWA_pwa12_142_RECOVERY_BONDS_CANDIDATE_01_source.zip
            PWA12_142_SHA256.txt
            Chrome_Requiem_v14_PWA_pwa12_142_RECOVERY_BONDS_CANDIDATE_01_source/DEVELOPMENT_NOTE_PWA12_142_RECOVERY_BONDS.md
            Chrome_Requiem_v14_PWA_pwa12_142_RECOVERY_BONDS_CANDIDATE_01_source/qa
          retention-days: 7
