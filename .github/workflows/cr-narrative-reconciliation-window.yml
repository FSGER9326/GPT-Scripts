name: Chrome Requiem Narrative Reconciliation Window

on:
  push:
    paths:
      - '.github/workflows/cr-narrative-reconciliation-window.yml'
      - 'scripts/cr_pwa12_136_reconciliation_window_source_url.txt'
      - 'scripts/cr_pwa12_136_reconciliation_window_ci.sh'
      - 'scripts/cr_pwa12_136_reconciliation_window_patch.py'
      - 'scripts/cr_pwa12_136_reconciliation_window_contract.mjs'
      - 'scripts/cr_pwa12_136_reconciliation_window_browser.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, browser-validate and package candidate
        shell: bash
        run: bash scripts/cr_pwa12_136_reconciliation_window_ci.sh
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chrome-Requiem-PWA12-136-Reconciliation-Window-Candidate-01
          path: out/
          if-no-files-found: error
          retention-days: 30
