name: CR City Bundle Seam Audit

on:
  push:
    paths:
      - '.github/workflows/cr-city-bundle-seams.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact PWA12.104 canonical
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact work
          gh api -H 'Accept: application/vnd.github+json' /repos/FSGER9326/GPT-Scripts/actions/artifacts/10668614759/zip > artifact.zip
          unzip -q artifact.zip -d artifact
          INNER=$(find artifact -maxdepth 1 -name '*FACTION_STREET_FAVORS_CANDIDATE_01_source.zip' -print -quit)
          unzip -q "$INNER" -d work
          ROOT=$(find work -maxdepth 1 -type d -name 'Chrome_Requiem_v14_PWA_pwa12_105_FACTION_STREET_FAVORS_CANDIDATE_01' -print -quit)
          python3 scripts/cr_restore_pwa12_104_from_105.py "$ROOT"
          cd "$ROOT"
          python3 tools/rebundle_runtime.py
          python3 tools/build_pwa11.py '14.0.0-pwa.12.104-street-contact-support'
          python3 - <<'PY'
          import json
          m=json.load(open('build-meta.json'))
          assert m['buildHash']=='4313da4acd4c324a7672c36e',m
          print('VERIFIED EXACT CANONICAL',m)
          PY
          echo "ROOT=$PWD" >> "$GITHUB_ENV"
      - name: Inspect routing and overworld initialization seams
        shell: bash
        run: |
          set -euo pipefail
          echo '===== routeToPoint / routeToLocation ====='
          grep -n -C 12 -E 'function routeToPointV133|function routeToLocationV133' "$ROOT/src/world/district-worlds-v13-3.js" || true
          echo '===== camera creation / init overworld ====='
          grep -n -C 12 -E 'Game\.camera|function initOverworldV133|initOverworldV133=' "$ROOT/src/world/district-worlds-v13-3.js" | head -n 280 || true
          echo '===== existing routing browser regression ====='
          sed -n '1,260p' "$ROOT/tests/pwa12_49_operation_routing_browser.py"
          echo '===== stage consequences browser setup ====='
          sed -n '1,140p' "$ROOT/tests/pwa12_45_stage_consequences_browser.py"
