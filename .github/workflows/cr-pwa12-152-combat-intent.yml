name: CR PWA12.152 Combat Intent Telemetry

on:
  push:
    branches: [agent/pwa12-152-combat-intent-telemetry]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout combat tooling branch
        uses: actions/checkout@v4

      - name: Download exact RC03 and qualified PWA12.148 applicator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work out
          curl -fL --retry 3 'https://sdmntprwestus.oaiusercontent.com/files/00000000-15b8-8230-91c7-487cdca13b10/raw?se=2026-09-22T06%3A33%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=731bfc61-341c-54e3-8eb3-8e75e563050d&skoid=1e6af1bf-6b08-4a04-8919-15773e7e7024&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T05%3A49%3A26Z&ske=2026-09-23T05%3A49%3A26Z&sks=b&skv=2026-02-06&sig=XAGaUJ96JVyRb%2BrDp4S2EVaPWGtgjGG5Bjm6vWCsv3Y%3D' -o work/rc03.zip
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-5c50-81f5-8978-972e479de009/raw?se=2026-09-22T06%3A33%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=0c61f215-bc21-5650-b30c-409bcc82a1c2&skoid=1e6af1bf-6b08-4a04-8919-15773e7e7024&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T03%3A27%3A09Z&ske=2026-09-23T03%3A27%3A09Z&sks=b&skv=2026-02-06&sig=XgcwEAA1oMAnEjx0jMrlmIpfOvBcroemCHCaqsLGkUA%3D' -o work/apply148.py
          test "$(stat -c%s work/rc03.zip)" = '85686548'
          echo 'e4dfd4b1f1e150b7c66f38781adfe3f2e752a7a40b16cfa79c3595152dcd09cc  work/rc03.zip' | sha256sum -c -

      - name: Reconstruct cumulative PWA12.148 combat line
        shell: bash
        run: |
          set -euo pipefail
          python3 work/apply148.py work/rc03.zip work/pwa148.zip
          mkdir work/pwa148
          unzip -q work/pwa148.zip -d work/pwa148
          ROOT=$(find work/pwa148 -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Apply PWA12.152 telemetry and cumulative tactical DPR cap
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cr_pwa12_152_combat_intent_telemetry_patch.py "$ROOT"
          node --check "$ROOT/src/legacy/mercenary-intelligence-v8.js"
          node --check "$ROOT/src/legacy/core-v5.js"
          node --check "$ROOT/src/legacy/graphics-v6.js"
          node --check "$ROOT/src/runtime/runtime-bundle.js"

      - name: Focused and inherited combat contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          python3 tests/pwa12_152_combat_intent_telemetry_contract.py
          python3 tests/pwa12_146_fire_maneuver_handoff_contract.py
          python3 tests/pwa12_145_heavy_suppression_arc_contract.py
          python3 tests/pwa12_139_objective_security_sweep_contract.py
          python3 tests/pwa12_137_target_pressure_synthesis_contract.py
          python3 tests/pwa12_124_suppression_contract.py
          python3 tests/pwa12_123_mission_lifecycle_contract.py
          python3 tests/pwa12_31_save_recovery_contract.py
          python3 tests/pwa12_62_safe_load_menu_contract.py
          python3 tests/pwa11_manifest_contract.py
          node tests/pwa11_service_worker.test.mjs

      - name: Prepare Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium >/dev/null

      - name: PWA12.152 Chromium telemetry acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cr_pwa12_152_intent_telemetry_browser.py "$ROOT"

      - name: Inherited real-browser combat and frozen-world regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          python3 tests/pwa12_137_target_pressure_browser.py .
          python3 tests/pwa12_139_objective_security_sweep_browser.py .
          python3 tests/world_freeze_browser.py .

      - name: Package isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE='Chrome_Requiem_v14_PWA_pwa12_152_COMBAT_INTENT_TELEMETRY_CANDIDATE_01_source'
          PARENT=$(dirname "$ROOT")
          mv "$ROOT" "$PARENT/$CANDIDATE"
          ROOT="$PARENT/$CANDIDATE"
          cp "$ROOT/DEVELOPMENT_NOTE_PWA12_152_COMBAT_INTENT_TELEMETRY.md" out/
          cp "$ROOT/build-meta.json" out/BUILD_META.json
          cp "$ROOT/qa/pwa12-152-intent-telemetry-mobile.png" out/
          (cd "$PARENT" && zip -qr "$GITHUB_WORKSPACE/out/${CANDIDATE}.zip" "$CANDIDATE")
          sha256sum "out/${CANDIDATE}.zip" | tee out/SHA256.txt
          cat out/BUILD_META.json

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chrome-Requiem-PWA12-152-Combat-Intent-Telemetry
          path: out/
          if-no-files-found: error
          retention-days: 30
