name: CR Procedural Candidate 04 Integration

on:
  push:
    branches: [agent/cr-procedural-c04-integration-20260922]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-integrate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
      - name: Download Candidate 03
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work out
          curl -fL --retry 3 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-a1fc-820a-b68f-97270d5d88d1/raw?se=2026-09-22T01%3A23%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=26c9758a-ea76-566c-baa7-40a6e078914f&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T00%3A06%3A08Z&ske=2026-09-23T00%3A06%3A08Z&sks=b&skv=2026-02-06&sig=GAilk7O/ZFIZ5bqC4ISWqR/F62q%2BRrZk25jxTXaunsw%3D' -o candidate03.zip
          unzip -q candidate03.zip -d work
      - name: Inspect browser QA patterns
        shell: bash
        run: |
          set -euo pipefail
          ROOT=work/cr_proc_route_candidate_03
          {
            echo '=== EGRESS BROWSER ==='
            cat "$ROOT/tests/pwa12_104_procedural_egress_route_browser.py"
            echo '=== OPTIONAL BROWSER ==='
            cat "$ROOT/tests/pwa12_104_procedural_optional_clause_browser.py"
            echo '=== FACTION BROWSER ==='
            cat "$ROOT/tests/pwa12_104_procedural_faction_transition_browser.py"
          } | tee out/browser_patterns.txt
      - name: Upload inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: CR-Procedural-C04-Browser-Patterns
          path: out/browser_patterns.txt
          if-no-files-found: error
          retention-days: 7
