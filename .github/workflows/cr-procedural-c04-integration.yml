              lock=page.evaluate('''(id)=>{const m=(Game.contacts||[]).flatMap(c=>c.missions||[]).find(x=>x.id===id);const before=Game.credits,result=mitigateComplicationV140(m);return{result,before,after:Game.credits,locked:mitigationLockedV140(m),mitigated:m.v140Complication.mitigated}}''',data['id']);assert lock['locked'] and lock['result'] is False and lock['before']==lock['after'] and not lock['mitigated'],lock
              combat=deploy(page,data);assert combat['approach']=='v134b_ap_service' and combat['staged'],combat;assert combat['alerted'] and combat['q'].get('runtimeTriggered') is True,combat;assert combat['q'].get('runtimeApproach')=='v134b_ap_service',combat;assert combat['enemyAwareness'] and all(x['a']==100 and x['alerted'] for x in combat['enemyAwareness']),combat;assert combat['reward']==data['before']['reward'] and combat['xp']==data['before']['xp'],combat;page.screenshot(path=str(QA/'candidate04_complication_unmitigated_combat.png'),full_page=True);assert not errors and not missing,(errors,missing);page.close()
              # Mitigated quiet ingress must retain the native quiet-start behavior and persist the sunk cost.
              page,errors,missing=open_page(browser);data2=setup_contract(page,'Complication Mitigated QA');brief2=open_brief(page,data2);cost=brief2['q']['mitigationCost'];credits=page.evaluate('()=>Game.credits');page.locator('.v140-complication-brief .v140-mitigate').click(timeout=5000);post=page.evaluate('''()=>({credits:Game.credits,q:Game.pendingMission.v140Complication,button:!!document.querySelector('.v140-complication-brief .v140-mitigate')})''');assert post['q']['mitigated'] and post['q']['mitigationPaid']==cost and post['credits']==credits-cost and not post['button'],post
              persisted=page.evaluate('''(id)=>{const before=Game.credits,ok=loadGame(0),m=(Game.contacts||[]).flatMap(c=>c.missions||[]).find(x=>x.id===id);return{ok,credits:Game.credits,before,q:m?.v140Complication||null}}''',data2['id']);assert persisted['ok'] and persisted['q']['mitigated'] and persisted['q']['mitigationPaid']==cost and persisted['credits']==post['credits'],persisted
              # Re-enter the restored mission briefing and stage through the real physical-approach path.
              page.evaluate('''(x)=>{const c=(Game.contacts||[]).find(c=>c.id===x.contact);Game.contactRelations[c.id]??={};Game.contactRelations[c.id].known=true;if(Game.districtWorldsV133?.activeId!==c.sectorId)activateDistrictV133(c.sectorId,null);Game.ovPlayer={x:c.x,y:c.y};renderContactDossierV13(c.id);showScreen('v13-contact-screen')}''',data2)
              page.locator(f'#v13-contracts [data-m="{data2["id"]}"]').click(timeout=8000);page.wait_for_function("()=>Game.screen==='v10-briefing' && !!Game.pendingMission",timeout=8000);stage_service(page,data2);combat2=deploy(page,data2);assert combat2['approach']=='v134b_ap_service' and combat2['staged'],combat2;assert combat2['alerted'] is False and not combat2['q'].get('runtimeTriggered',False),combat2;assert combat2['enemyAwareness'] and all(x['a']==0 and not x['alerted'] for x in combat2['enemyAwareness']),combat2;assert combat2['reward']==data2['before']['reward'] and combat2['xp']==data2['before']['xp'],combat2;page.screenshot(path=str(QA/'candidate04_complication_mitigated_combat.png'),full_page=True);assert not errors and not missing,(errors,missing)
              print('PASS procedural complication browser transitions',{'unmitigated':{'id':combat['id'],'kind':combat['q']['kind'],'approach':combat['approach'],'alerted':combat['alerted'],'shape':combat['shape']},'mitigated':{'id':combat2['id'],'kind':combat2['q']['kind'],'cost':cost,'approach':combat2['approach'],'alerted':combat2['alerted'],'shape':combat2['shape']},'saveLoad':persisted['ok']},flush=True);browser.close()
          PY
          python3 -m py_compile "$ROOT/tests/pwa12_104_procedural_complication_browser.py"

      - name: Prepare Chromium QA runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright
