name: CR Procedural Candidate 04 Integration

on:
  push:
    branches: [agent/cr-procedural-c04-integration-20260922]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4

      - name: Download Candidate 03 and hardened Candidate 04 module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads work out
          curl -fL --retry 3 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-e65c-820a-be82-4a9f78d66c0f/raw?se=2026-09-22T01%3A31%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=b9640c78-6b00-52ab-9224-309fa9bf709e&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T21%3A46%3A47Z&ske=2026-09-22T21%3A46%3A47Z&sks=b&skv=2026-02-06&sig=fDjQa2hP3JbATJiYT4J7q9Zbf8u%2BzAXtjieY0YgKdVY%3D' -o downloads/candidate03.zip
          curl -fL --retry 3 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-c1cc-820a-8144-0b1cb2ee2264/raw?se=2026-09-22T01%3A31%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=bfc3450c-4534-5a23-8e00-1f8aabe84afa&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T21%3A32%3A50Z&ske=2026-09-22T21%3A32%3A50Z&sks=b&skv=2026-02-06&sig=4cu8bhanqtkowcAm3GgYIL1IWc%2BZ3pDtb%2BdY3N0CHZo%3D' -o downloads/procedural-complications-v14.js
          unzip -q downloads/candidate03.zip -d work
          test -s downloads/procedural-complications-v14.js
          test "$(python3 -c "import json;print(json.load(open('work/cr_proc_route_candidate_03/build-meta.json'))['version'])")" = '14.0.0-pwa.12.104-procedural-egress-route-candidate.03'

      - name: Integrate Candidate 04 into ordered runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT=work/cr_proc_route_candidate_03
          python3 - <<'PY'
          from pathlib import Path
          root=Path('work/cr_proc_route_candidate_03')
          raw=Path('downloads/procedural-complications-v14.js').read_text(encoding='utf-8-sig')
          module=root/'src/missions/procedural-complications-v14.js'
          module.write_text(raw,encoding='utf-8')
          build=root/'tools/build_pwa11.py'
          text=build.read_text(encoding='utf-8')
          src="    'src/missions/procedural-complications-v14.js',\n"
          anchor="    'src/missions/multistage-operations-v14.js',\n"
          if src not in text:
              if text.count(anchor)!=1: raise SystemExit('build source anchor missing/ambiguous')
              text=text.replace(anchor,anchor+src,1)
              build.write_text(text,encoding='utf-8')
          bundle=root/'src/runtime/runtime-bundle.js'
          b=bundle.read_text(encoding='utf-8')
          marker='/* SOURCE: src/missions/procedural-complications-v14.js */'
          next_marker='/* SOURCE: src/visuals/visual-identity-v13-6.js */'
          if marker not in b:
              if b.count(next_marker)!=1: raise SystemExit('runtime insertion anchor missing/ambiguous')
              b=b.replace(next_marker,marker+'\n'+raw.rstrip()+'\n\n'+next_marker,1)
              bundle.write_text(b,encoding='utf-8')
          print('integrated module bytes',module.stat().st_size)
          PY
          cd "$ROOT"
          node --check src/missions/procedural-complications-v14.js
          python3 tools/rebundle_runtime.py
          python3 tools/build_pwa11.py '14.0.0-pwa.12.104-procedural-complication-intel-candidate.04'
          node --check src/runtime/runtime-bundle.js
          python3 - <<'PY'
          import json
          m=json.load(open('build-meta.json'))
          assert m['version']=='14.0.0-pwa.12.104-procedural-complication-intel-candidate.04',m
          b=open('src/runtime/runtime-bundle.js',encoding='utf-8').read()
          assert b.count('SOURCE: src/missions/procedural-complications-v14.js')==1
          assert b.index('SOURCE: src/missions/multistage-operations-v14.js') < b.index('SOURCE: src/missions/procedural-complications-v14.js') < b.index('SOURCE: src/visuals/visual-identity-v13-6.js')
          print('PASS ordered runtime integration',m)
          PY

      - name: Install Candidate 04 deterministic contract test
        shell: bash
        run: |
          set -euo pipefail
          ROOT=work/cr_proc_route_candidate_03
          cat > "$ROOT/tests/pwa12_104_procedural_complication_contract.mjs" <<'MJS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const src=fs.readFileSync(new URL('../src/missions/procedural-complications-v14.js',import.meta.url),'utf8');
          const profiles={dock_nine:{security:2},undergrid:{security:1},glass_heights:{security:5},old_market:{security:3},civic_circuit:{security:4}};
          const Game={day:1,contacts:[],contactRelations:{},credits:10000,rep:{},safehouse:{server:1},serverTier:1,units:[],objective:{quiet:true},contractApproachesV134B:{plan:null}};
          const box={console,Game,V12_TACTICAL_PROFILES:profiles,saveCount:0,
            generatedContactContractV137:m=>!!m?.generated,
            multiStageConflictV139:m=>!!m?.multiStage,
            applyApproachAlertV134B:()=>true,
            createCombatUnits:m=>m,
            contactTrustV13:id=>Number(Game.contactRelations?.[id]?.trust||0),
            missionIntelTierV12:()=>Number(Game.serverTier||1),
            saveGame:()=>{box.saveCount++},toast:()=>{},logMsg:()=>{}};
          box.window=box; vm.createContext(box); vm.runInContext(src,box,{filename:'procedural-complications-v14.js'});
          assert.equal(box.ChromeRequiem.modules.ProceduralComplicationsV140.metaVersion,1);
          const objectives=['eliminate','bounty','raid','breach','sabotage','steal','secure','rescue','extract','heist'];
          const targets=['meridian','wraiths','iron','chrome','spine'];
          const sectors=Object.keys(profiles); let total=0,enabled=0,disabled=0; const chances=new Set(),kinds=new Set(); let sample=null;
          const norm=x=>JSON.parse(JSON.stringify(x));
          for(let si=0;si<sectors.length;si++)for(let oi=0;oi<objectives.length;oi++)for(let ti=0;ti<targets.length;ti++)for(let diff=1;diff<=5;diff++){
            const sector=sectors[si],objective=objectives[oi],target=targets[ti],id=`qa_${si}_${oi}_${ti}_${diff}`;
            const contact={id:`c_${si}`,sectorId:sector,faction:'meridian',missions:[]};
            const base={id,generated:true,contact:contact.id,sectorId:sector,objective,type:objective,targetFaction:target,diff,enemies:['Guard','Enforcer','Guard'],reward:900+diff*100,xp:110+diff*5,v137ContractComposition:{seed:100000+total}};
            const m=norm(base),q=box.assignComplicationV140(m,contact,7,oi); total++; assert(q,'metadata missing');
            const m2=norm(base),q2=box.assignComplicationV140(m2,contact,7,oi); assert.equal(JSON.stringify(norm(q)),JSON.stringify(norm(q2)),'determinism failure');
            assert.equal(m.reward,base.reward);assert.equal(m.xp,base.xp);assert.deepEqual(m.enemies,base.enemies);assert.equal(m.objective,base.objective);assert.equal(m.targetFaction,base.targetFaction);
            assert(q.chance>=28&&q.chance<=52,q); chances.add(q.chance);
            if(q.enabled){enabled++;kinds.add(q.kind);assert(q.mitigationCost>=70&&q.mitigationCost<=180,q);sample??={m,contact};} else disabled++;
          }
          assert.equal(total,1250);assert(enabled>0&&disabled>0,{enabled,disabled});assert(chances.size>=10,[...chances]);assert.equal(kinds.size,4,[...kinds]);
          const authored={id:'authored',generated:false,objective:'raid',type:'raid',enemies:['a','b'],reward:900,xp:100};assert.equal(box.assignComplicationV140(authored,{id:'c'},1,0),null);assert(!authored.v140Complication);
          const multi={id:'multi',generated:true,multiStage:true,objective:'heist',type:'heist',enemies:['a','b','c'],reward:1200,xp:100,targetFaction:'spine',sectorId:'glass_heights'};const mq=box.assignComplicationV140(multi,{id:'c',sectorId:'glass_heights'},1,0);assert.equal(mq.enabled,false);assert.equal(mq.reason,'INELIGIBLE');
          const unsupported={id:'unsupported',generated:true,objective:'escort',type:'escort',enemies:['a','b'],reward:800,xp:90,targetFaction:'iron',sectorId:'old_market'};assert.equal(box.assignComplicationV140(unsupported,{id:'c',sectorId:'old_market'},1,0).enabled,false);
          assert(sample,'no enabled sample');
          const persisted=norm(sample.m); persisted.v140Complication.runtimeTriggered=true;persisted.v140Complication.runtimeApproach='v134b_ap_service';persisted.v140Complication.runtimeDay=9;
          Game.contacts=[{...sample.contact,missions:[persisted]}];const durable=norm(persisted.v140Complication);box.resetComplicationRuntimeV140();const after=persisted.v140Complication;assert.equal(after.seed,durable.seed);assert.equal(after.kind,durable.kind);assert.equal(after.enabled,durable.enabled);assert(!('runtimeTriggered'in after)&&!('runtimeApproach'in after)&&!('runtimeDay'in after));
          const serialized=JSON.parse(JSON.stringify(persisted));const replay=box.assignComplicationV140(serialized,sample.contact,99,99);assert.equal(replay.seed,after.seed);assert.equal(replay.kind,after.kind);
          const mit=norm(sample.m);mit.v140Complication.mitigated=false;mit.v140Complication.mitigationPaid=0;Game.contractApproachesV134B.plan=null;Game.activeMission=null;Game.credits=10000;const cost=mit.v140Complication.mitigationCost,beforeCredits=Game.credits;assert.equal(box.mitigateComplicationV140(mit),true);assert.equal(Game.credits,beforeCredits-cost);const once=Game.credits;assert.equal(box.mitigateComplicationV140(mit),true);assert.equal(Game.credits,once);
          const locked=norm(sample.m);locked.v140Complication.mitigated=false;locked.v140Complication.mitigationPaid=0;locked.v134bStaged=true;Game.credits=10000;const lockedCash=Game.credits;assert.equal(box.mitigateComplicationV140(locked),false);assert.equal(Game.credits,lockedCash);
          const quiet=norm(sample.m);quiet.v140Complication.mitigated=false;quiet.v134bApproach='v134b_ap_service';Game.activeMission=quiet;Game.alerted=false;Game.objective={quiet:true};Game.units=[{team:'enemy',awareness:0,alerted:false},{team:'enemy',awareness:0,alerted:false}];assert.equal(box.applyComplicationRuntimeV140(quiet),true);assert.equal(Game.alerted,true);assert.equal(Game.objective.quiet,false);assert(Game.units.every(x=>x.awareness===100&&x.alerted));assert.equal(quiet.v140Complication.runtimeTriggered,true);
          const front=norm(sample.m);front.v140Complication.mitigated=false;front.v134bApproach='v134b_ap_front';Game.activeMission=front;Game.alerted=false;Game.objective={quiet:false};Game.units=[{team:'enemy',awareness:100,alerted:true}];assert.equal(box.applyComplicationRuntimeV140(front),false);assert.equal(Game.alerted,false);
          const intel=norm(sample.m);Game.contacts=[{...sample.contact,missions:[intel]}];Game.contactRelations[sample.contact.id]={trust:0};Game.serverTier=1;assert.equal(box.complicationIntelV140(intel,sample.contact).tier,0);Game.serverTier=2;Game.contactRelations[sample.contact.id].trust=20;assert.equal(box.complicationIntelV140(intel,sample.contact).tier,1);Game.serverTier=3;assert.equal(box.complicationIntelV140(intel,sample.contact).tier,2);
          console.log('PASS procedural complication deterministic contract',JSON.stringify({total,enabled,disabled,chances:[Math.min(...chances),Math.max(...chances)],kinds:[...kinds].sort(),sample:{kind:sample.m.v140Complication.kind,cost:sample.m.v140Complication.mitigationCost}}));
          MJS
          node --check "$ROOT/tests/pwa12_104_procedural_complication_contract.mjs"

      - name: Install Candidate 04 Chromium transition test
        shell: bash
        run: |
          set -euo pipefail
          ROOT=work/cr_proc_route_candidate_03
          cat > "$ROOT/tests/pwa12_104_procedural_complication_browser.py" <<'PY'
          """Real Chromium integration for deterministic intel-driven generated-contract exposure complications."""
          from pathlib import Path
          import mimetypes
          from playwright.sync_api import sync_playwright
          ROOT=Path(__file__).resolve().parents[1]; QA=ROOT/'qa'; QA.mkdir(parents=True,exist_ok=True)
          HTML=(ROOT/'index.html').read_text(encoding='utf-8')
          SHIM="""<script>const __s=new Map();const __ls={getItem:k=>__s.has(String(k))?__s.get(String(k)):null,setItem:(k,v)=>__s.set(String(k),String(v)),removeItem:k=>__s.delete(String(k)),clear:()=>__s.clear(),key:i=>[...__s.keys()][i]??null,get length(){return __s.size}};Object.defineProperty(window,'localStorage',{value:__ls,configurable:true});Object.defineProperty(window,'sessionStorage',{value:__ls,configurable:true});</script>"""
          HTML=HTML.replace('<head>','<head><base href="http://cr.local/">'+SHIM,1).replace('bootChromeRequiemV14({registerPwa:true})','bootChromeRequiemV14({registerPwa:false})')
          def open_page(browser):
              page=browser.new_page(viewport={'width':1280,'height':900},device_scale_factor=1);errors=[];missing=[];page.on('pageerror',lambda e:errors.append(e.stack or str(e)))
              def route(r):
                  url=r.request.url
                  if not url.startswith('http://cr.local/'): return r.abort()
                  rel=url[len('http://cr.local/'):].split('?',1)[0] or 'index.html';fp=ROOT/rel
                  if fp.is_file(): r.fulfill(status=200,body=fp.read_bytes(),content_type=mimetypes.guess_type(fp.name)[0] or 'application/octet-stream')
                  else: missing.append(rel);r.fulfill(status=404,body=b'NOT FOUND')
              page.route('http://cr.local/**',route);page.set_content(HTML,wait_until='domcontentloaded');page.wait_for_function('()=>!!window.ChromeRequiemV14Boot?.ready',timeout=45000);return page,errors,missing
          def setup_contract(page,label):
              data=page.evaluate('''(label)=>{
                let picked=null;
                for(let attempt=0;attempt<5&&!picked;attempt++){startNewGame(label+' '+attempt,'Hacker','street');document.getElementById('story-modal')?.classList.remove('open');for(const c of Game.contacts||[]){for(const m of c.missions||[]){if(m.v140Complication?.version===1&&m.v140Complication.enabled){picked={c,m};break}}if(picked)break}}
                if(!picked)return {error:'no enabled complication on generated boards',rows:(Game.contacts||[]).flatMap(c=>(c.missions||[]).map(m=>({id:m.id,obj:m.objective||m.type,q:m.v140Complication||null})))};
                const {c,m}=picked;Game.contactRelations[c.id]??={};Game.contactRelations[c.id].known=true;Game.credits=Math.max(10000,Game.credits||0);if(Game.districtWorldsV133?.activeId!==c.sectorId)activateDistrictV133(c.sectorId,null);Game.ovPlayer={x:c.x,y:c.y};
                const before={id:m.id,contact:c.id,target:m.targetFaction,reward:m.reward,xp:m.xp,enemies:[...(m.enemies||[])],objective:m.objective||m.type,route:JSON.parse(JSON.stringify(m.v139RouteVariant||null)),clause:JSON.parse(JSON.stringify(m.v138OptionalClause||null)),q:JSON.parse(JSON.stringify(m.v140Complication))};
                saveGame(4,true);m.v140Complication.seed=(m.v140Complication.seed+1)>>>0;m.v140Complication.runtimeTriggered=true;const ok=loadGame(4);const c2=(Game.contacts||[]).find(x=>x.id===c.id),m2=(c2?.missions||[]).find(x=>x.id===m.id);if(!ok||!m2)return {error:'actual save/load lost mission',ok};
                const persist={seed:m2.v140Complication?.seed,kind:m2.v140Complication?.kind,enabled:m2.v140Complication?.enabled,runtimeTriggered:m2.v140Complication?.runtimeTriggered??null};
                if(Game.districtWorldsV133?.activeId!==c2.sectorId)activateDistrictV133(c2.sectorId,null);Game.ovPlayer={x:c2.x,y:c2.y};renderContactDossierV13(c2.id);showScreen('v13-contact-screen');const card=document.querySelector(`#v13-contracts [data-m="${m2.id}"]`),chip=card?.querySelector('.v140-risk-chip');
                return {id:m2.id,contact:c2.id,before,persist,card:!!card,chip:chip?.textContent||'',credits:Game.credits};
              }''',label)
              assert not data.get('error'),data;assert data['card'] and data['chip'].startswith('RISK'),data;assert data['persist']['seed']==data['before']['q']['seed'] and data['persist']['kind']==data['before']['q']['kind'] and data['persist']['enabled'] is True,data;assert data['persist']['runtimeTriggered'] is None,data;return data
          def open_brief(page,data):
              page.locator(f'#v13-contracts [data-m="{data["id"]}"]').click(timeout=8000);page.wait_for_function("()=>Game.screen==='v10-briefing' && !!Game.pendingMission",timeout=8000)
              brief=page.evaluate('''()=>({id:Game.pendingMission.id,reward:Game.pendingMission.reward,xp:Game.pendingMission.xp,q:Game.pendingMission.v140Complication,text:document.querySelector('#v10-brief-body .v140-complication-brief')?.textContent||'',service:!!document.querySelector('.v134b-approach[data-id="v134b_ap_service"]:not([disabled])')})''')
              assert brief['id']==data['id'] and brief['reward']==data['before']['reward'] and brief['xp']==data['before']['xp'],brief;assert brief['q']['enabled'] and 'RISK ' in brief['text'] and 'MITIGATION' in brief['text'],brief;assert brief['service'],brief;return brief
          def stage_service(page,data):
              page.locator('.v134b-approach[data-id="v134b_ap_service"]').click(timeout=5000);page.locator('#v10-brief-deploy').click(timeout=5000);page.wait_for_function('(id)=>Game.contractApproachesV134B?.plan?.missionId===id',arg=data['id'],timeout=5000)
              complete=page.evaluate('''()=>{const n=currentPlannedNodeV134B();if(!n)return {error:'no physical staging node'};Game.ovPlayer={x:n.x,y:n.y};const ok=completeMissionApproachV134B({kind:'v134b',id:n.id});return {ok,ready:Game.contractApproachesV134B?.plan?.ready,node:{x:n.x,y:n.y,id:n.id}}}''');assert not complete.get('error') and complete['ok'] and complete['ready'],complete;page.wait_for_selector('#v134b-stage-modal.open #v134b-stage-deploy',timeout=5000);return complete
          def deploy(page,data):
              page.locator('#v134b-stage-deploy').click(timeout=5000);page.wait_for_function('(id)=>Game.activeMission?.id===id && Game.screen===\'combat\'',arg=data['id'],timeout=15000)
              return page.evaluate('''()=>{const m=Game.activeMission,q=m.v140Complication;return{id:m.id,reward:m.reward,xp:m.xp,q,approach:m.v134bApproach,staged:!!m.v134bStaged,alerted:!!Game.alerted,objectiveQuiet:Game.objective?.quiet??null,enemyAwareness:(Game.units||[]).filter(u=>u.team==='enemy').map(u=>({a:u.awareness,alerted:!!u.alerted})),objective:Game.objective?.type,shape:Game.arenaShapeV14||null,route:m.v139RouteVariant||null,clause:m.v138OptionalClause||null}}''')
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True,executable_path='/usr/bin/chromium',args=['--no-sandbox','--disable-dev-shm-usage'])
