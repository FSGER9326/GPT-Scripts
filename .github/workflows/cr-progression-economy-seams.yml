name: CR Progression Economy Seams

on:
  push:
    paths:
      - '.github/workflows/cr-progression-economy-seams.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  seams:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact PWA12.104 canonical
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact work out
          gh api -H 'Accept: application/vnd.github+json' /repos/FSGER9326/GPT-Scripts/actions/artifacts/10668614759/zip > artifact.zip
          unzip -q artifact.zip -d artifact
          INNER=$(find artifact -maxdepth 1 -name '*FACTION_STREET_FAVORS_CANDIDATE_01_source.zip' -print -quit)
          test -n "$INNER"
          unzip -q "$INNER" -d work
          ROOT=$(find work -maxdepth 1 -type d -name 'Chrome_Requiem_v14_PWA_pwa12_105_FACTION_STREET_FAVORS_CANDIDATE_01' -print -quit)
          test -n "$ROOT"
          python3 scripts/cr_restore_pwa12_104_from_105.py "$ROOT"
          cd "$ROOT"
          python3 tools/rebundle_runtime.py
          python3 tools/build_pwa11.py '14.0.0-pwa.12.104-street-contact-support'
          python3 - <<'PY'
          import json
          m=json.load(open('build-meta.json'))
          assert m['version']=='14.0.0-pwa.12.104-street-contact-support',m
          assert m['buildHash']=='4313da4acd4c324a7672c36e',m
          assert m['schemaVersion']==14,m
          print('VERIFIED_CANONICAL',m)
          PY
          echo "CANONICAL_ROOT=$PWD" >> "$GITHUB_ENV"

      - name: Extract exact progression and economy seams
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$CANONICAL_ROOT"
          OUT="$GITHUB_WORKSPACE/out"
          cd "$ROOT"
          cp build-meta.json "$OUT/"
          mkdir -p "$OUT"
          for f in \
            src/legacy/megacity-v11.js \
            src/legacy/city-life-v13.js \
            src/company/company-foundation-v13-5.js \
            src/bootstrap/module-manifest.js \
            src/bootstrap/bootstrap.js \
            tools/build_pwa11.py \
            tools/rebundle_runtime.py; do
            if [ -f "$f" ]; then mkdir -p "$OUT/$(dirname "$f")"; cp "$f" "$OUT/$f"; fi
          done
          while IFS= read -r f; do
            mkdir -p "$OUT/$(dirname "$f")"
            cp "$f" "$OUT/$f"
          done < <(grep -rlEi --include='*.js' --include='*.py' 'loot|reward|rare.?stock|market|shop|vendor|armory|attachment|salvage|sell|buy|credits|workshop|weapon' src/missions src/company src/progression src/runtime tests 2>/dev/null | head -n 120)
          {
            echo '=== BUILD META ==='; cat build-meta.json
            echo; echo '=== MEGACITY ECONOMY/ARMORY ==='; grep -n -E -C 8 'MANUFACTUR|ATTACH|armory|loot|reward|weapon|workshop|salvage|sell|buy|credits' src/legacy/megacity-v11.js || true
            echo; echo '=== CITY MARKET/RARE STOCK ==='; grep -n -E -C 8 'SHOP|MARKET|rare|stock|price|buy|sell|vendor|armory|loot|reward|workshop' src/legacy/city-life-v13.js || true
            echo; echo '=== MISSION REWARD HOOKS ==='; grep -R -n -E -C 6 'loot|reward|credits|manufacturer|attachment|weapon|salvage|rare.?stock' src/missions src/company src/progression 2>/dev/null || true
            echo; echo '=== PERSISTENCE HOOKS ==='; grep -R -n -E -C 5 'serialize|hydrate|saveGame|loadGame|stash|armory|inventory|rareStock|cityLife|schemaVersion' src/runtime src/company src/legacy src/progression 2>/dev/null || true
          } > "$OUT/ECONOMY_SEAMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: cr-pwa12-104-progression-economy-seams
          path: out
          retention-days: 7

      - name: Publish verified text seams into scratch repo
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/analysis/cr-pwa12-104-progression-economy-seams"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$GITHUB_WORKSPACE/out/." "$DEST/"
          git config user.name 'CR automation'
          git config user.email 'actions@users.noreply.github.com'
          git add analysis/cr-pwa12-104-progression-economy-seams
          git commit -m 'Publish verified PWA12.104 progression economy seams' || exit 0
          git push origin HEAD:main
