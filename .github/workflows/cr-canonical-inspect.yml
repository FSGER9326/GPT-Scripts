name: CR Faction Street Favor Candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout scratch tooling
        uses: actions/checkout@v4

      - name: Download explicit PWA12.104 canonical
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work out
          curl -fL --retry 3 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-7d30-820b-bcb5-22ab42d3e6e9/raw?se=2026-09-21T23%3A19%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=f84b07fb-4fb5-5fe4-a0ba-7f00356783c6&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T21%3A45%3A20Z&ske=2026-09-22T21%3A45%3A20Z&sks=b&skv=2026-02-06&sig=atcjQkWmR8c9SW/CnGJl9bOB%2BFwUFt65xtLztdYxeXc%3D' -o canonical.zip
          unzip -q canonical.zip -d work
          test "$(python3 -c "import json;print(json.load(open('work/cr103/build-meta.json'))['version'])")" = '14.0.0-pwa.12.104-street-contact-support'

      - name: Patch and rebuild candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cr_pwa12_105_street_favors_patch.py work/cr103
          cd work/cr103
          python3 tools/rebundle_runtime.py
          python3 tools/build_pwa11.py '14.0.0-pwa.12.105-faction-street-favors'

      - name: Install focused QA scripts
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/cr_pwa12_105_street_favor_contract.py work/cr103/tests/pwa12_105_street_favor_contract.py
          cp scripts/cr_pwa12_105_street_favor_browser.py work/cr103/tests/pwa12_105_street_favor_browser.py

      - name: Prepare Chromium QA runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium >/dev/null
          PLAYWRIGHT_CHROMIUM=$(python3 -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          sudo ln -sf "$PLAYWRIGHT_CHROMIUM" /usr/bin/chromium

      - name: Static and inherited regression checks
        working-directory: work/cr103
        shell: bash
        run: |
          set -euo pipefail
          node --check src/runtime/runtime-bundle.js
          python3 tests/pwa12_105_street_favor_contract.py .
          python3 tests/pwa12_104_street_contact_support_contract.py
          python3 tests/pwa12_83_street_aftermath_contract.py
          python3 tests/pwa12_88_street_population_aftermath_contract.py
          python3 tests/pwa12_98_physical_infrastructure_control_contract.py
          python3 tests/pwa12_100_district_control_effect_contract.py
          python3 tests/pwa12_102_district_control_preview_contract.py
          python3 tests/pwa12_103_district_control_context_contract.py
          python3 tests/pwa12_31_save_recovery_contract.py
          python3 tests/pwa12_62_safe_load_menu_contract.py
          python3 tests/pwa11_manifest_contract.py
          node tests/pwa11_service_worker.test.mjs

      - name: Browser integration and affected-flow regressions
        working-directory: work/cr103
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/pwa12_105_street_favor_browser.py .
          python3 tests/pwa12_67_intel_contact_browser.py
          python3 tests/pwa12_49_operation_routing_browser.py
          python3 tests/pwa12_45_stage_consequences_browser.py

      - name: Document and package candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cr_pwa12_105_write_note.py work/cr103
          cp work/cr103/DEVELOPMENT_NOTE_PWA12_105_FACTION_STREET_FAVORS.md out/
          cp work/cr103/qa/pwa12-105-street-favor-mobile.png out/
          cp work/cr103/build-meta.json out/BUILD_META.json
          CANDIDATE='Chrome_Requiem_v14_PWA_pwa12_105_FACTION_STREET_FAVORS_CANDIDATE_01'
          mv work/cr103 "work/$CANDIDATE"
          cd work
          zip -qr "../out/${CANDIDATE}_source.zip" "$CANDIDATE"
          cd ..
          sha256sum "out/${CANDIDATE}_source.zip" | tee out/SHA256.txt

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chrome-Requiem-PWA12-105-Faction-Street-Favors
          path: out/
          if-no-files-found: error
          retention-days: 30
