name: CR Canonical Inspect
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect integration seams
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-3a0c-820b-81e7-9ca174a70d49/raw?se=2026-09-21T23%3A10%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=8c2321cf-2462-5b5a-8b86-4884c6daf507&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T20%3A39%3A56Z&ske=2026-09-22T20%3A39%3A56Z&sks=b&skv=2026-02-06&sig=ITyiSTm2NJmmR1YYZoxV%2BI3ulmV8NMD2zurgAiVwyWM%3D' -o canonical.zip
          unzip -q canonical.zip -d canonical
          cd canonical/cr103
          echo '=== BUILDER HEAD ==='; sed -n '1,175p' tools/build_pwa11.py
          echo '=== REBUNDLE ==='; cat tools/rebundle_runtime.py
          echo '=== LIVING HEAD ==='; sed -n '1,25p' src/world/living-streets-v13-4a.js
          echo '=== NEAR CONTACT ==='; grep -nE 'nearContact|contact.*distance|currentLocation' src/missions/multistage-operations-v14.js | head -80
          echo '=== NEAR CONTACT CONTEXT ==='; line=$(grep -n 'function nearContact' src/missions/multistage-operations-v14.js | head -1 | cut -d: -f1 || true); if [ -n "$line" ]; then start=$((line-20)); end=$((line+55)); sed -n "${start},${end}p" src/missions/multistage-operations-v14.js; fi
          echo '=== INDEX SCRIPT ORDER ==='; grep -nE '<script[^>]+src=' index.html | tail -90
          echo '=== CURRENT RUNTIME INPUTS ==='; grep -nE 'living-streets|multistage|district-worlds|contract-approaches|city-life' tools/rebundle_runtime.py index.html
          echo '=== TEST NAMES ==='; find tests -maxdepth 1 -type f -printf '%f\n' | sort | tail -160
