## Integrated improvement: physical Street Favors
PWA12.104 already lets a trusted contact (Trust >=20) physically authored in the current district warn the crew before a Street Clash. This candidate extends that existing relationship through the aftermath rather than adding an unrelated faction screen.

A supported Street Clash victory banks one persistent one-use Street Favor with that supporting contact. The favor records its source clash, physical district, neighborhood, hostile faction, actor type, difficulty and earned day inside the already-persisted `Game.livingStreetsV134` object. The source mission ID is also recorded in a favor-history map so the same clash cannot create the favor twice. If the contact already owes a favor, later wins do not overwrite it.

The favor appears directly in the contact dossier. Remote access shows the obligation but locks both actions. Resolution uses the shipping `CR14MultiStageOperations.nearContact()` physical-location check, including its district-aware coordinate guard.

### Player choice
1. **CALL IN COVER** — consumes the favor, removes 12 neighborhood local heat and 8 heat from the hostile faction tied to the source clash, then journals and saves the resolution.
2. **TURN FAVOR INTO COUNTERMOVE** — consumes the favor and creates a real optional bounty contract on that same contact's board, in the same physical district, against the source hostile faction. It uses ordinary mission rewards, sponsoring-contact faction reputation gain, target-faction reputation loss/heat, tactical staging and persistence. Contacts refuse to commission an open countermove against their own faction; cover remains available in that case.

A lost Street Clash does not generate a favor. Existing PWA12.104 pre-combat warning/back-up behavior remains unchanged.

## Save compatibility
No new root save object and no schema bump were introduced. `contactFavors` and `contactFavorHistory` are additive maps lazy-initialized under `Game.livingStreetsV134`, which PWA12.104 already serializes/restores. Existing schema-14 states without either field initialize both safely.

